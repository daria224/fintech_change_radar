# Whole system in one resource: database, worker and bot.
# Coolify fills the SERVICE_* values itself; you only set TELEGRAM_TOKEN and OPENROUTER_API_KEY.
# Collection runs inside worker every 6 hours; disable the former external collector cron.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=desk_research
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d desk_research"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile_inline: |
        # Self-contained Fintech Change Radar: no Git checkout or registry account.
        # Runtime snapshot SHA256: 1371f7ec72556e8e1e97083ed35e1eb6aeb99d441b0c25f74381a2a94e1a54eb
        FROM python:3.12-slim
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 PYTHONUTF8=1
        WORKDIR /app
        RUN python -c "import base64,hashlib,io,tarfile; data=base64.b64decode(''); assert hashlib.sha256(data).hexdigest()=='1371f7ec72556e8e1e97083ed35e1eb6aeb99d441b0c25f74381a2a94e1a54eb'; tarfile.open(fileobj=io.BytesIO(data),mode='r:gz').extractall('/app',filter='data')"
        RUN pip install --no-cache-dir -r requirements.txt
        EXPOSE 8080
        CMD ["python", "main.py"]
    environment:
      - BLOCK=worker
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/desk_research
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MODEL=${MODEL:-openai/gpt-4.1-mini}
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile_inline: |
        # Self-contained Fintech Change Radar: no Git checkout or registry account.
        # Runtime snapshot SHA256: 1371f7ec72556e8e1e97083ed35e1eb6aeb99d441b0c25f74381a2a94e1a54eb
        FROM python:3.12-slim
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 PYTHONUTF8=1
        WORKDIR /app
        RUN python -c "import base64,hashlib,io,tarfile; data=base64.b64decode(''); assert hashlib.sha256(data).hexdigest()=='1371f7ec72556e8e1e97083ed35e1eb6aeb99d441b0c25f74381a2a94e1a54eb'; tarfile.open(fileobj=io.BytesIO(data),mode='r:gz').extractall('/app',filter='data')"
        RUN pip install --no-cache-dir -r requirements.txt
        EXPOSE 8080
        CMD ["python", "main.py"]
    environment:
      - SERVICE_FQDN_BOT_8080
      - BLOCK=bot
      - PORT=8080
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/desk_research
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - MINI_APP_URL=${SERVICE_FQDN_BOT}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
